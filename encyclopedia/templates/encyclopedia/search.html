{% extends "encyclopedia/layout.html" %}

{% block title %}
    Search Result
{% endblock %}

{% block body %}
    <h1>Search Results:</h1>
    {% if results%}
        <ul>
            {% for entry in results %}
                <li>
                    <a href="wiki/{{ entry }}">
                        {{ entry }}
                    </a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        Article Not Found!
    {% endif %}

{% endblock %}
